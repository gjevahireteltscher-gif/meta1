name: dependency-frontend-evaluation

# Manual only: this downloads WiMCor/ConMeC at runtime, installs Stanza, and
# runs UD dependency parsing over ~47k sentences on a CPU runner -- slow and
# not something that belongs on every push. Trigger from the Actions tab
# ("Run workflow") or `gh workflow run dependency-frontend-evaluation.yml`.
#
# WiMCor (CC BY-SA 3.0) and ConMeC (Apache-2.0) are fetched fresh into
# /tmp/corpora for this run only -- never committed to the repo, never
# cached, matching evaluation/README.md's "keep corpus text out of Git and
# CI artifacts" policy. Only the aggregate metrics.json produced by
# run_experiment.py (no per-instance sentence text) is uploaded as an
# artifact.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      AGDA_RTS: +RTS -M6G -RTS
      STANZA_MODEL_DIR: /home/runner/.cache/metonymy/stanza/models
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cubical and GF RGL
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/metonymy/cubical-v0.5
            ~/.cache/metonymy/gf-rgl-20260403
            ~/.cache/metonymy/gf-rgl-lib
          key: metonymy-${{ runner.os }}-132a2a3-e825d92-gf312

      - name: Cache Stanza package and models
        uses: actions/cache@v5
        with:
          path: ~/.cache/metonymy/stanza
          key: stanza-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}

      - name: Install pinned system toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends agda-bin cabal-install curl ghc git make ripgrep
          curl -L \
            "https://github.com/GrammaticalFramework/gf-core/releases/download/release-3.12/gf-3.12-ubuntu-24.04.deb" \
            -o /tmp/gf.deb
          echo "17aa5452b713f1e00a0755a1bad998a926acbffb96eefde2c3800ca72536b4d8  /tmp/gf.deb" \
            | sha256sum -c -
          sudo apt-get install -y /tmp/gf.deb

      - name: Build and verify (same as ci.yml)
        run: ./scripts/reproduce.sh

      - name: Install dependency-frontend toolchain (Stanza)
        run: ./scripts/bootstrap_dependency_frontend.sh

      - name: Download WiMCor v1.1 and ConMeC (not committed, not cached)
        run: |
          mkdir -p /tmp/corpora
          curl -fL "https://kevinalexmathews.github.io/files/wimcor-v1.1.tar.gz" \
            -o /tmp/corpora/wimcor-v1.1.tar.gz
          curl -fL "https://raw.githubusercontent.com/SaptGhosh/ConMeC/main/DATASET.csv" \
            -o /tmp/corpora/ConMeC.csv

      - name: Prepare datasets
        run: |
          python3 scripts/evaluation/prepare_wimcor.py \
            --archive /tmp/corpora/wimcor-v1.1.tar.gz --split test \
            --output build/evaluation/wimcor-test.combined.jsonl
          python3 scripts/evaluation/prepare_conmec.py \
            --csv /tmp/corpora/ConMeC.csv \
            --output build/evaluation/conmec.combined.jsonl \
            --quarantine build/evaluation/conmec-quarantine.json
          for ds in wimcor-test conmec; do
            python3 scripts/evaluation/split_inputs_gold.py \
              --combined build/evaluation/$ds.combined.jsonl \
              --inputs build/evaluation/$ds.inputs.jsonl \
              --gold build/evaluation/$ds.gold.jsonl
          done

      - name: Annotate UD dependency hints
        run: |
          for ds in wimcor-test conmec; do
            python3 scripts/annotate_dependency_hints.py \
              --dataset build/evaluation/$ds.inputs.jsonl \
              --output build/evaluation/$ds.dependency-hints.jsonl
          done

      - name: Run predictions (legacy and dependency frontends)
        run: |
          for ds in wimcor-test conmec; do
            python3 scripts/evaluation/run_engine_predictions.py \
              --engine build/metonymy --dataset build/evaluation/$ds.inputs.jsonl \
              --output build/evaluation/$ds.legacy-predictions.jsonl
            python3 scripts/evaluation/run_engine_predictions.py \
              --engine build/metonymy --dataset build/evaluation/$ds.inputs.jsonl \
              --frontend dependency \
              --dependency-hints build/evaluation/$ds.dependency-hints.jsonl \
              --output build/evaluation/$ds.dependency-predictions.jsonl
          done

      - name: Score both frontends
        run: |
          for ds in wimcor-test conmec; do
            for frontend in legacy dependency; do
              python3 scripts/evaluation/run_experiment.py \
                --dataset build/evaluation/$ds.inputs.jsonl \
                --gold build/evaluation/$ds.gold.jsonl \
                --predictions build/evaluation/$ds.$frontend-predictions.jsonl \
                --metadata evaluation/toolchain.json \
                --output-dir build/evaluation/$ds-$frontend-report
            done
          done

      - name: Install Ollama and pull the promotion-evidence pilot model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull llama3.2:3b-instruct

      - name: LLM promotion-evidence pilot (sampled, paired before/after)
        run: |
          for ds in wimcor-test conmec; do
            python3 scripts/evaluation/extract_promotion_candidates.py \
              --predictions build/evaluation/$ds.dependency-predictions.jsonl \
              --inputs build/evaluation/$ds.inputs.jsonl \
              --output build/evaluation/$ds.promotion-candidates.jsonl

            python3 scripts/propose_promotion_evidence.py \
              --candidates build/evaluation/$ds.promotion-candidates.jsonl \
              --output build/evaluation/$ds.evidence.tsv \
              --sample-ids-output build/evaluation/$ds.sample-ids.txt \
              --sample-size 750

            python3 scripts/evaluation/filter_by_ids.py \
              --ids build/evaluation/$ds.sample-ids.txt \
              --input build/evaluation/$ds.inputs.jsonl \
              --output build/evaluation/$ds.sample.inputs.jsonl
            python3 scripts/evaluation/filter_by_ids.py \
              --ids build/evaluation/$ds.sample-ids.txt \
              --input build/evaluation/$ds.gold.jsonl \
              --output build/evaluation/$ds.sample.gold.jsonl

            python3 scripts/evaluation/run_engine_predictions.py \
              --engine build/metonymy \
              --dataset build/evaluation/$ds.sample.inputs.jsonl \
              --frontend dependency \
              --dependency-hints build/evaluation/$ds.dependency-hints.jsonl \
              --output build/evaluation/$ds.sample.before-predictions.jsonl
            python3 scripts/evaluation/run_engine_predictions.py \
              --engine build/metonymy \
              --dataset build/evaluation/$ds.sample.inputs.jsonl \
              --frontend dependency \
              --dependency-hints build/evaluation/$ds.dependency-hints.jsonl \
              --evidence build/evaluation/$ds.evidence.tsv \
              --output build/evaluation/$ds.sample.after-predictions.jsonl

            for when in before after; do
              python3 scripts/evaluation/run_experiment.py \
                --dataset build/evaluation/$ds.sample.inputs.jsonl \
                --gold build/evaluation/$ds.sample.gold.jsonl \
                --predictions build/evaluation/$ds.sample.$when-predictions.jsonl \
                --metadata evaluation/toolchain.json \
                --output-dir build/evaluation/$ds-promotion-$when-report
            done
          done

      - name: Summarize
        run: |
          {
            echo "## Dependency-frontend evaluation (legacy vs. dependency)"
            for ds in wimcor-test conmec; do
              for frontend in legacy dependency; do
                echo "### $ds / $frontend"
                echo '```json'
                python3 -m json.tool "build/evaluation/$ds-$frontend-report/metrics.json"
                echo '```'
              done
            done
            echo "## LLM promotion-evidence pilot (sampled, paired before/after)"
            echo "Precision of promoted paths depends on the LLM's judgment,"
            echo "not on Agda -- see evaluation/README.md's caveat."
            for ds in wimcor-test conmec; do
              for when in before after; do
                echo "### $ds / $when"
                echo '```json'
                python3 -m json.tool "build/evaluation/$ds-promotion-$when-report/metrics.json"
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate metrics and pilot evidence (no corpus text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-frontend-evaluation-metrics
          # evidence.tsv is id/target_entity_id/source only, no sentence
          # text. promotion-candidates.jsonl (sentence + target text from
          # the corpus) is deliberately NOT uploaded, matching
          # evaluation/README.md's policy of keeping corpus text out of CI
          # artifacts even for openly licensed corpora.
          path: |
            build/evaluation/*-report/metrics.json
            build/evaluation/*.evidence.tsv
          retention-days: 30
